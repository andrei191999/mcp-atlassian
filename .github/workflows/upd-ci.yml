name: UPD CI

on:
  push:
    branches:
      - 'upd/**'
    tags:
      - 'v*.post*'
  pull_request:
    branches:
      - 'upd/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for version check (tag-version job)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run pytest
        id: pytest
        run: |
          set +e
          uv run pytest -q -p no:cacheprovider --junitxml=junit.xml
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Upload junit.xml
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-xml
          path: junit.xml
          if-no-files-found: error

      - name: Run doctests
        run: |
          python -m doctest scripts/upd_check_junit.py
          python -m doctest scripts/upd_check_tag_version.py

      - name: Check known failures
        run: |
          python scripts/upd_check_junit.py \
            junit.xml \
            .github/upd-known-failures.txt \
            --pytest-rc "${{ steps.pytest.outputs.rc }}"

  tag-version:
    runs-on: ubuntu-latest
    if: >
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '') ||
      github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      - name: Determine tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [[ -n "$INPUT_TAG" ]]; then
            echo "value=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "value=v0.23.1.post2" >> "$GITHUB_OUTPUT"
          fi

      - name: Save checker script
        run: cp scripts/upd_check_tag_version.py /tmp/upd_check_tag_version.py

      - name: Build wheel from tag
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          git worktree add /tmp/wheel-build "$TAG"
          cd /tmp/wheel-build
          uv build --wheel --out-dir /tmp/wheel-dist
          git worktree remove /tmp/wheel-build --force

      - name: Check tag version
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          python /tmp/upd_check_tag_version.py \
            "$TAG" \
            /tmp/wheel-dist/*.whl
